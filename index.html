<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>plinks — Space Plinko</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #010a18;
  --navy: #050f22;
  --panel: rgba(5, 15, 40, 0.85);
  --blue: #00aaff;
  --purple: #9b30ff;
  --gold: #ffd700;
  --green: #00ff88;
  --red: #ff2244;
  --white: #e8f0ff;
  --glow-blue: 0 0 12px #00aaff88, 0 0 24px #00aaff44;
  --glow-gold: 0 0 12px #ffd70088, 0 0 24px #ffd70044;
  --glow-purple: 0 0 12px #9b30ff88, 0 0 24px #9b30ff44;
}

body {
  font-family: 'Orbitron', monospace;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Starfield ── */
#starfield {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── Layout ── */
#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 900px;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
}

/* ── Header ── */
#header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border: 1px solid var(--blue);
  border-radius: 12px;
  padding: 0.75rem 1.5rem;
  box-shadow: var(--glow-blue);
}

#header h1 {
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(90deg, var(--blue), var(--purple), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#balance-display {
  text-align: right;
}

#balance-label {
  font-size: 0.6rem;
  color: var(--blue);
  letter-spacing: 2px;
  text-transform: uppercase;
}

#balance-amount {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gold);
  text-shadow: var(--glow-gold);
}

/* ── Main area ── */
#main {
  display: flex;
  gap: 1rem;
  width: 100%;
  align-items: flex-start;
}

/* ── Canvas ── */
#canvas-wrap {
  position: relative;
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--purple);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--glow-purple);
}

#game-canvas {
  display: block;
  width: 100%;
  height: auto;
}

/* ── Side Panel ── */
#side-panel {
  width: 200px;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.panel-box {
  background: var(--panel);
  border: 1px solid var(--blue);
  border-radius: 10px;
  padding: 1rem;
  box-shadow: var(--glow-blue);
}

.panel-box h3 {
  font-size: 0.6rem;
  letter-spacing: 2px;
  color: var(--blue);
  margin-bottom: 0.75rem;
  text-transform: uppercase;
}

/* ── Bet controls ── */
#bet-display {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--gold);
  text-align: center;
  margin-bottom: 0.5rem;
  text-shadow: var(--glow-gold);
}

#bet-slider {
  width: 100%;
  accent-color: var(--blue);
  margin-bottom: 0.5rem;
  cursor: pointer;
}

.bet-presets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.35rem;
  margin-bottom: 0.5rem;
}

.preset-btn {
  background: rgba(0,170,255,0.1);
  border: 1px solid var(--blue);
  border-radius: 5px;
  color: var(--blue);
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem;
  padding: 0.3rem 0;
  cursor: pointer;
  transition: all 0.15s;
}

.preset-btn:hover {
  background: rgba(0,170,255,0.25);
  box-shadow: var(--glow-blue);
}

#btn-allin {
  width: 100%;
  background: rgba(255,210,0,0.1);
  border: 1px solid var(--gold);
  border-radius: 5px;
  color: var(--gold);
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem;
  padding: 0.35rem 0;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 1px;
}

#btn-allin:hover {
  background: rgba(255,210,0,0.25);
  box-shadow: var(--glow-gold);
}

/* ── Launch button ── */
#btn-launch {
  width: 100%;
  padding: 0.9rem;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: 'Orbitron', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 0 20px rgba(0,170,255,0.4);
}

#btn-launch:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 0 30px rgba(0,170,255,0.6);
}

#btn-launch:active:not(:disabled) {
  transform: translateY(0);
}

#btn-launch:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ── Prize table ── */
.prize-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.3rem 0.4rem;
  border-radius: 5px;
  margin-bottom: 0.25rem;
  font-size: 0.55rem;
  letter-spacing: 0.5px;
  transition: all 0.3s;
}

.prize-row .mult {
  font-weight: 700;
  font-size: 0.75rem;
}

.prize-row.bust    { border-left: 3px solid var(--red);    color: var(--red); }
.prize-row.signal  { border-left: 3px solid #88aaff;       color: #88aaff; }
.prize-row.artifact{ border-left: 3px solid var(--blue);   color: var(--blue); }
.prize-row.warp    { border-left: 3px solid var(--purple);  color: var(--purple); }
.prize-row.jackpot { border-left: 3px solid var(--gold);   color: var(--gold); }

.prize-row.highlight {
  background: rgba(255,255,255,0.12);
  transform: scale(1.03);
}

/* ── Result message ── */
#result-banner {
  width: 100%;
  text-align: center;
  padding: 0.6rem 1rem;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 2px;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 1px solid #333;
  transition: all 0.3s;
}

/* ── Game Over overlay ── */
#gameover {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(1, 5, 18, 0.92);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
}

#gameover.visible { display: flex; }

#gameover h2 {
  font-size: 3rem;
  color: var(--red);
  text-shadow: 0 0 30px var(--red), 0 0 60px #ff224477;
  letter-spacing: 6px;
  animation: pulse-red 1.2s ease-in-out infinite;
}

@keyframes pulse-red {
  0%, 100% { text-shadow: 0 0 30px var(--red), 0 0 60px #ff224477; }
  50%       { text-shadow: 0 0 60px var(--red), 0 0 120px #ff224477; }
}

#gameover p {
  font-size: 1rem;
  color: var(--white);
  opacity: 0.7;
  letter-spacing: 1px;
}

#btn-tryagain {
  padding: 1rem 3rem;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  border: none;
  border-radius: 12px;
  color: #fff;
  font-family: 'Orbitron', monospace;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(155,48,255,0.5);
  transition: all 0.2s;
}

#btn-tryagain:hover {
  transform: scale(1.05);
  box-shadow: 0 0 50px rgba(155,48,255,0.7);
}

/* ── Particle canvas ── */
#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 50;
}

/* ── Flash overlay ── */
#flash {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 60;
  opacity: 0;
  transition: opacity 0.1s;
}

@media (max-width: 620px) {
  #main { flex-direction: column; }
  #side-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
  #side-panel .panel-box { flex: 1; min-width: 160px; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<canvas id="particle-canvas"></canvas>
<div id="flash"></div>

<div id="app">
  <header id="header">
    <h1>plinks</h1>
    <div id="balance-display">
      <div id="balance-label">Credits</div>
      <div id="balance-amount">$50.00</div>
    </div>
  </header>

  <div id="result-banner">— Awaiting Launch —</div>

  <div id="main">
    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="side-panel">
      <!-- Bet -->
      <div class="panel-box">
        <h3>Bet Amount</h3>
        <div id="bet-display">$5.00</div>
        <input type="range" id="bet-slider" min="5" max="10000" step="5" value="5">
        <div class="bet-presets">
          <button class="preset-btn" data-amt="5">$5</button>
          <button class="preset-btn" data-amt="25">$25</button>
          <button class="preset-btn" data-amt="100">$100</button>
          <button class="preset-btn" data-amt="500">$500</button>
        </div>
        <button id="btn-allin">ALL IN</button>
      </div>

      <!-- Launch -->
      <button id="btn-launch">LAUNCH</button>

      <!-- Prize table -->
      <div class="panel-box">
        <h3>Prize Table</h3>
        <div class="prize-row bust"     id="pr-bust">    <span>HULL BREACH</span><span class="mult">0x</span></div>
        <div class="prize-row signal"   id="pr-signal">  <span>SIGNAL</span>     <span class="mult">1.5x</span></div>
        <div class="prize-row artifact" id="pr-artifact"><span>ARTIFACT</span>   <span class="mult">2x</span></div>
        <div class="prize-row warp"     id="pr-warp">    <span>WARP CORE</span>  <span class="mult">5x</span></div>
        <div class="prize-row jackpot"  id="pr-jackpot"> <span>1ST CONTACT</span><span class="mult">10x</span></div>
      </div>
    </div>
  </div>
</div>

<!-- Game Over -->
<div id="gameover">
  <h2>HULL BREACH</h2>
  <p>All credits lost. Transmission ended.</p>
  <p id="go-final" style="color:var(--gold);font-size:0.9rem;">Final Balance: $0.00</p>
  <button id="btn-tryagain">TRY AGAIN</button>
</div>

<script>
/* ════════════════════════════════════════════════
   CONSTANTS
   ════════════════════════════════════════════════ */
const OUTCOME_MAP = {
  bust:     { id: 'bust',     label: 'HULL BREACH',     mult: 0,   color: '#ff2244' },
  signal:   { id: 'signal',   label: 'SIGNAL DETECTED', mult: 1.5, color: '#88aaff' },
  artifact: { id: 'artifact', label: 'ALIEN ARTIFACT',  mult: 2,   color: '#00ccff' },
  warp:     { id: 'warp',     label: 'WARP CORE!',      mult: 5,   color: '#9b30ff' },
  jackpot:  { id: 'jackpot',  label: 'FIRST CONTACT!',  mult: 10,  color: '#ffd700' },
};

// Fixed slot prizes — 13 slots, symmetric, jackpot at centre
const SLOT_LAYOUT = [
  'bust','bust','signal','signal','artifact',
  'warp','jackpot','warp','artifact',
  'signal','signal','bust','bust'
];

const ROWS = 12;
const PEG_RADIUS = 5;
const BALL_RADIUS = 8;
const CANVAS_W = 520;
const CANVAS_H = 625;
const GRAVITY = 0.38;
const BOUNCE = 0.38;
const FRICTION = 0.985;
const SLOT_COUNT = ROWS + 1; // 13 slots
const WALL_W = 5;

/* ════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════ */
let balance  = 50;
let betAmt   = 5;
let dropping = false;
let launchX  = CANVAS_W / 2;

/* ════════════════════════════════════════════════
   DOM
   ════════════════════════════════════════════════ */
const gameCanvas    = document.getElementById('game-canvas');
const gctx          = gameCanvas.getContext('2d');
const starCanvas    = document.getElementById('starfield');
const sctx          = starCanvas.getContext('2d');
const particleCanvas= document.getElementById('particle-canvas');
const pctx          = particleCanvas.getContext('2d');
const flash         = document.getElementById('flash');
const balanceEl     = document.getElementById('balance-amount');
const betDisplay    = document.getElementById('bet-display');
const betSlider     = document.getElementById('bet-slider');
const btnLaunch     = document.getElementById('btn-launch');
const btnAllin      = document.getElementById('btn-allin');
const resultBanner  = document.getElementById('result-banner');
const gameover      = document.getElementById('gameover');
const btnTryagain   = document.getElementById('btn-tryagain');

/* ════════════════════════════════════════════════
   CANVAS SIZING
   ════════════════════════════════════════════════ */
gameCanvas.width  = CANVAS_W;
gameCanvas.height = CANVAS_H;

function resizeAux() {
  starCanvas.width  = window.innerWidth;
  starCanvas.height = window.innerHeight;
  particleCanvas.width  = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}
resizeAux();
window.addEventListener('resize', resizeAux);

/* ════════════════════════════════════════════════
   STARFIELD
   ════════════════════════════════════════════════ */
const stars = Array.from({ length: 200 }, () => ({
  x: Math.random() * 2000,
  y: Math.random() * 2000,
  r: Math.random() * 1.5 + 0.3,
  a: Math.random(),
  da: (Math.random() - 0.5) * 0.006,
}));

function drawStarfield() {
  sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  stars.forEach(s => {
    s.a = Math.max(0.1, Math.min(1, s.a + s.da));
    if (s.a <= 0.1 || s.a >= 1) s.da = -s.da;
    sctx.beginPath();
    sctx.arc(s.x % starCanvas.width, s.y % starCanvas.height, s.r, 0, Math.PI * 2);
    sctx.fillStyle = `rgba(200,220,255,${s.a})`;
    sctx.fill();
  });
}

/* ════════════════════════════════════════════════
   PEG GRID LAYOUT
   ════════════════════════════════════════════════ */
const PAD_TOP      = 52;
const PAD_SIDE     = 32;
const GHOST_Y      = 20;
const usableW      = CANVAS_W - PAD_SIDE * 2;       // 456
const slotW        = usableW / SLOT_COUNT;            // ~35.1
const PEG_AREA_H   = 355;
const PEG_AREA_BOT = PAD_TOP + PEG_AREA_H;          // 407
const GATE_TOP     = PEG_AREA_BOT + 22;             // 429
const GATE_H       = 181;
const GATE_BOT     = GATE_TOP + GATE_H;             // 610

const pegs = [];
for (let row = 0; row < ROWS; row++) {
  const cols    = row + 2;
  const spacing = usableW / (cols - 1);
  const rowY    = PAD_TOP + (row / (ROWS - 1)) * PEG_AREA_H;
  for (let col = 0; col < cols; col++) {
    pegs.push({ x: PAD_SIDE + col * spacing, y: rowY });
  }
}

/* slot centres are at PAD_SIDE + (i + 0.5) * slotW — no separate array needed */

/* ════════════════════════════════════════════════
   BALL PHYSICS
   ════════════════════════════════════════════════ */
let ball = null;
let pegFlash = {}; // pegIdx -> timer

function spawnBall(outcome) {
  // Pre-determine outcome, then steer ball toward matching slot
  const targetSlots = slots
    .map((s, i) => ({ i, s }))
    .filter(({ s }) => s.outcome.id === outcome.id);

  let targetSlot;
  if (targetSlots.length > 0) {
    targetSlot = targetSlots[Math.floor(Math.random() * targetSlots.length)];
  } else {
    // fallback: reassign a random slot to this outcome
    const idx = Math.floor(Math.random() * SLOT_COUNT);
    slots[idx].outcome = outcome;
    targetSlot = { i: idx, s: slots[idx] };
  }

  ball = {
    x: CANVAS_W / 2 + (Math.random() - 0.5) * 30,
    y: 10,
    vx: (Math.random() - 0.5) * 1.5,
    vy: 2,
    trail: [],
    targetX: targetSlot.s.x,
    outcome,
    landed: false,
    landSlot: targetSlot.i,
  };
}

function updateBall() {
  if (!ball || ball.landed) return;

  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 18) ball.trail.shift();

  ball.vy += GRAVITY;
  ball.vx *= FRICTION;
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Gentle steering toward target slot (subtle)
  const dx = ball.targetX - ball.x;
  const progress = ball.y / CANVAS_H;
  ball.vx += dx * 0.0008 * progress;

  // Wall bounce
  if (ball.x < PAD_SIDE + BALL_RADIUS) {
    ball.x = PAD_SIDE + BALL_RADIUS;
    ball.vx = Math.abs(ball.vx) * BOUNCE;
  }
  if (ball.x > CANVAS_W - PAD_SIDE - BALL_RADIUS) {
    ball.x = CANVAS_W - PAD_SIDE - BALL_RADIUS;
    ball.vx = -Math.abs(ball.vx) * BOUNCE;
  }

  // Peg collision
  for (let i = 0; i < pegs.length; i++) {
    const peg = pegs[i];
    const ddx = ball.x - peg.x;
    const ddy = ball.y - peg.y;
    const dist = Math.sqrt(ddx * ddx + ddy * ddy);
    const minDist = BALL_RADIUS + PEG_RADIUS;
    if (dist < minDist && dist > 0) {
      const nx = ddx / dist;
      const ny = ddy / dist;
      const sep = minDist - dist;
      ball.x += nx * sep;
      ball.y += ny * sep;
      const dot = ball.vx * nx + ball.vy * ny;
      ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE + (Math.random() - 0.5) * 0.6;
      ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE;
      if (ball.vy < 1) ball.vy = 1;
      pegFlash[i] = 8;
      playPegSound();
      break;
    }
  }

  // Land check
  if (ball.y >= SLOT_Y - BALL_RADIUS) {
    ball.y = SLOT_Y - BALL_RADIUS;
    ball.vy = 0;
    ball.vx = 0;
    ball.landed = true;
    onBallLanded();
  }
}

/* ════════════════════════════════════════════════
   OUTCOME DETERMINATION
   ════════════════════════════════════════════════ */
function weightedOutcome() {
  let r = Math.random();
  for (const o of OUTCOMES) {
    r -= o.prob;
    if (r <= 0) return o;
  }
  return OUTCOMES[0];
}

/* ════════════════════════════════════════════════
   RESULT HANDLING
   ════════════════════════════════════════════════ */
let podShakeTimer = 0;
let podOpenTimer  = 0;

function onBallLanded() {
  const outcome = ball.outcome;
  lastResult = outcome;
  podShakeTimer = 40;

  // Highlight prize row
  document.querySelectorAll('.prize-row').forEach(el => el.classList.remove('highlight'));
  document.getElementById('pr-' + outcome.id).classList.add('highlight');

  setTimeout(() => {
    podOpenTimer = 60;
    applyResult(outcome);
  }, 700);
}

function applyResult(outcome) {
  const winnings = Math.round(betAmt * outcome.mult * 100) / 100;
  balance = Math.round((balance - betAmt + winnings) * 100) / 100;
  if (balance < 0) balance = 0;

  updateBalanceDisplay();
  showResult(outcome, winnings);

  if (outcome.id === 'bust') {
    triggerFlash('#ff2244', 0.35);
  } else if (outcome.id === 'jackpot') {
    triggerFlash('#ffd700', 0.4);
    launchConfetti();
  } else if (outcome.id === 'warp') {
    triggerFlash('#9b30ff', 0.3);
    launchStarBurst();
  }

  playResultSound(outcome);

  setTimeout(() => {
    dropping = false;
    ball = null;
    if (balance <= 0) {
      showGameOver();
    } else {
      btnLaunch.disabled = false;
      clampBet();
    }
  }, 1800);
}

function showResult(outcome, winnings) {
  resultBanner.style.border = `1px solid ${outcome.color}`;
  resultBanner.style.boxShadow = `0 0 16px ${outcome.color}66`;
  resultBanner.style.color = outcome.color;

  if (outcome.mult === 0) {
    resultBanner.textContent = `💥 ${outcome.label} — Lost $${betAmt.toFixed(2)}`;
  } else {
    resultBanner.textContent = `✨ ${outcome.label} — Won $${winnings.toFixed(2)} (${outcome.mult}x)`;
  }
}

/* ════════════════════════════════════════════════
   DRAWING
   ════════════════════════════════════════════════ */
function drawBoard() {
  gctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // Background grid lines
  gctx.strokeStyle = 'rgba(0,170,255,0.04)';
  gctx.lineWidth = 1;
  for (let x = 0; x < CANVAS_W; x += 30) {
    gctx.beginPath(); gctx.moveTo(x, 0); gctx.lineTo(x, CANVAS_H); gctx.stroke();
  }

  // Pegs
  pegs.forEach((peg, i) => {
    const flash = pegFlash[i] || 0;
    const glowColor = flash > 0 ? '#00ffff' : '#4488ff';
    const glowAmt   = flash > 0 ? 14 : 5;

    gctx.beginPath();
    gctx.arc(peg.x, peg.y, PEG_RADIUS, 0, Math.PI * 2);

    const grad = gctx.createRadialGradient(peg.x - 1, peg.y - 1, 0, peg.x, peg.y, PEG_RADIUS);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, glowColor);
    grad.addColorStop(1, flash > 0 ? '#00ffffaa' : '#1144aaaa');
    gctx.fillStyle = grad;

    gctx.shadowColor = glowColor;
    gctx.shadowBlur  = glowAmt;
    gctx.fill();
    gctx.shadowBlur = 0;

    if (flash > 0) pegFlash[i]--;
  });

  // Slots
  const slotOutcomeColors = {
    bust:     '#ff2244',
    signal:   '#88aaff',
    artifact: '#00aaff',
    warp:     '#9b30ff',
    jackpot:  '#ffd700',
  };

  slots.forEach((slot, i) => {
    const col = slotOutcomeColors[slot.outcome.id];
    const isLandSlot = ball && ball.landed && ball.landSlot === i;
    const shaking    = isLandSlot && podShakeTimer > 0;
    const opening    = isLandSlot && podOpenTimer > 0;

    let sx = slot.x;
    let sy = SLOT_Y;
    if (shaking) {
      sx += (Math.random() - 0.5) * 5;
      sy += (Math.random() - 0.5) * 3;
    }

    // Pod body
    gctx.save();
    gctx.translate(sx, sy);

    gctx.shadowColor = col;
    gctx.shadowBlur  = opening ? 20 : 8;

    // Bottom pod half
    gctx.beginPath();
    gctx.ellipse(0, 0, slotW * 0.42, 22, 0, 0, Math.PI);
    gctx.fillStyle = opening
      ? col + 'cc'
      : `rgba(10,20,50,0.9)`;
    gctx.strokeStyle = col;
    gctx.lineWidth = 2;
    gctx.fill();
    gctx.stroke();

    // Top pod half (opens upward when opening)
    const openAngle = opening ? Math.min(podOpenTimer / 60, 1) * -0.9 : 0;
    gctx.save();
    gctx.rotate(openAngle);
    gctx.beginPath();
    gctx.ellipse(0, 0, slotW * 0.42, 22, 0, Math.PI, Math.PI * 2);
    gctx.fillStyle = `rgba(10,20,60,0.95)`;
    gctx.strokeStyle = col;
    gctx.lineWidth = 2;
    gctx.fill();
    gctx.stroke();
    gctx.restore();

    // Glow dot
    gctx.beginPath();
    gctx.arc(0, -4, 4, 0, Math.PI * 2);
    gctx.fillStyle = col;
    gctx.fill();

    gctx.shadowBlur = 0;
    gctx.restore();
  });

  if (podShakeTimer > 0) podShakeTimer--;
  if (podOpenTimer > 0)  podOpenTimer--;

  // Ball
  if (ball) drawBall();
}

function drawBall() {
  // Trail
  ball.trail.forEach((pt, i) => {
    const alpha = i / ball.trail.length;
    const r = BALL_RADIUS * (0.3 + 0.7 * alpha);
    gctx.beginPath();
    gctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    gctx.fillStyle = `rgba(0,200,255,${alpha * 0.25})`;
    gctx.fill();
  });

  // Glow
  gctx.shadowColor = '#00eeff';
  gctx.shadowBlur  = 18;

  // Ball body
  const grad = gctx.createRadialGradient(
    ball.x - BALL_RADIUS * 0.3, ball.y - BALL_RADIUS * 0.3, BALL_RADIUS * 0.1,
    ball.x, ball.y, BALL_RADIUS
  );
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.35, '#00ddff');
  grad.addColorStop(0.8, '#0044ff');
  grad.addColorStop(1, '#001188');

  gctx.beginPath();
  gctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
  gctx.fillStyle = grad;
  gctx.fill();
  gctx.shadowBlur = 0;
}

/* ════════════════════════════════════════════════
   PARTICLES
   ════════════════════════════════════════════════ */
let particles = [];

function launchConfetti() {
  for (let i = 0; i < 220; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 8;
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 6,
      r: 5 + Math.random() * 6,
      color: ['#ffd700','#ff9900','#ff2244','#00aaff','#9b30ff','#00ff88'][Math.floor(Math.random() * 6)],
      life: 1,
      decay: 0.012 + Math.random() * 0.012,
      gravity: 0.2,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.2,
      rect: Math.random() > 0.4,
    });
  }
}

function launchStarBurst() {
  for (let i = 0; i < 100; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight * 0.6,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      r: 3 + Math.random() * 4,
      color: ['#9b30ff','#cc66ff','#ffffff','#6600ff'][Math.floor(Math.random() * 4)],
      life: 1,
      decay: 0.02 + Math.random() * 0.015,
      gravity: 0.12,
      rot: 0, rotV: 0,
      rect: false,
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  pctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  particles.forEach(p => {
    p.vx *= 0.98;
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    p.rot += p.rotV;

    pctx.globalAlpha = Math.max(0, p.life);
    pctx.fillStyle = p.color;

    if (p.rect) {
      pctx.save();
      pctx.translate(p.x, p.y);
      pctx.rotate(p.rot);
      pctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r);
      pctx.restore();
    } else {
      pctx.beginPath();
      pctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      pctx.fill();
    }
    pctx.globalAlpha = 1;
  });
}

/* ════════════════════════════════════════════════
   FLASH
   ════════════════════════════════════════════════ */
function triggerFlash(color, alpha) {
  flash.style.background = color;
  flash.style.opacity = alpha;
  setTimeout(() => { flash.style.opacity = 0; }, 120);
}

/* ════════════════════════════════════════════════
   WEB AUDIO
   ════════════════════════════════════════════════ */
let audioCtx = null;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playPegSound() {
  try {
    const ctx = getAudio();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g);
    g.connect(ctx.destination);
    o.type = 'sine';
    const freq = 400 + Math.random() * 600;
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 0.5, ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + 0.12);
  } catch(e) {}
}

function playResultSound(outcome) {
  try {
    const ctx = getAudio();
    if (outcome.id === 'bust') {
      // Low descending womp
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(180, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.6);
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
      o.start(); o.stop(ctx.currentTime + 0.7);
    } else if (outcome.id === 'jackpot') {
      // Fanfare: ascending notes
      [523, 659, 784, 1047].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'square';
        o.frequency.value = freq;
        const t = ctx.currentTime + i * 0.12;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.15, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        o.start(t); o.stop(t + 0.4);
      });
    } else if (outcome.id === 'warp') {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(200, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.5);
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
      o.start(); o.stop(ctx.currentTime + 0.6);
    } else {
      // Generic blip
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(440 * outcome.mult, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(880 * outcome.mult, ctx.currentTime + 0.25);
      g.gain.setValueAtTime(0.12, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      o.start(); o.stop(ctx.currentTime + 0.35);
    }
  } catch(e) {}
}

function playAmbient() {
  try {
    const ctx = getAudio();
    const bufSize = ctx.sampleRate * 3;
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let phase = 0;
    for (let i = 0; i < bufSize; i++) {
      phase += 0.0001;
      data[i] = (Math.sin(i * 0.0003) * 0.3 + Math.sin(i * 0.00017) * 0.2) * Math.sin(phase) * 0.04;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;
    const g = ctx.createGain();
    g.gain.value = 0.4;
    src.connect(g);
    g.connect(ctx.destination);
    src.start();
  } catch(e) {}
}

/* ════════════════════════════════════════════════
   GAME LOOP
   ════════════════════════════════════════════════ */
function loop() {
  drawStarfield();
  if (dropping) updateBall();
  drawBoard();
  updateParticles();
  requestAnimationFrame(loop);
}

/* ════════════════════════════════════════════════
   UI CONTROLS
   ════════════════════════════════════════════════ */
function updateBalanceDisplay() {
  balanceEl.textContent = '$' + balance.toFixed(2);
}

function updateBetDisplay() {
  betDisplay.textContent = '$' + betAmt.toFixed(2);
  betSlider.value = betAmt;
}

function clampBet() {
  betAmt = Math.min(betAmt, balance);
  betAmt = Math.max(5, betAmt);
  updateBetDisplay();
}

betSlider.addEventListener('input', () => {
  betAmt = parseFloat(betSlider.value);
  clampBet();
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    betAmt = parseFloat(btn.dataset.amt);
    clampBet();
  });
});

btnAllin.addEventListener('click', () => {
  betAmt = balance;
  updateBetDisplay();
});

btnLaunch.addEventListener('click', () => launch());

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !dropping) {
    e.preventDefault();
    launch();
  }
});

function launch() {
  if (dropping) return;
  if (balance < 5) { showGameOver(); return; }
  clampBet();
  if (betAmt < 5 || betAmt > balance) return;

  // Unlock audio on first interaction
  if (!audioCtx) {
    playAmbient();
  }

  dropping = true;
  btnLaunch.disabled = true;
  resultBanner.style.border = '1px solid #333';
  resultBanner.style.boxShadow = 'none';
  resultBanner.style.color = 'var(--white)';
  resultBanner.textContent = '— Launching —';

  document.querySelectorAll('.prize-row').forEach(el => el.classList.remove('highlight'));

  // Reassign slot outcomes fresh for variety
  slots.forEach((slot, i) => { slot.outcome = pickSlotOutcome(i); });

  const outcome = weightedOutcome();
  spawnBall(outcome);
}

/* ════════════════════════════════════════════════
   GAME OVER
   ════════════════════════════════════════════════ */
function showGameOver() {
  document.getElementById('go-final').textContent = 'Final Balance: $' + balance.toFixed(2);
  gameover.classList.add('visible');
}

btnTryagain.addEventListener('click', () => {
  balance = 50;
  betAmt  = 5;
  ball    = null;
  dropping = false;
  particles = [];
  lastResult = null;
  document.querySelectorAll('.prize-row').forEach(el => el.classList.remove('highlight'));
  gameover.classList.remove('visible');
  resultBanner.textContent = '— Awaiting Launch —';
  resultBanner.style.border = '1px solid #333';
  resultBanner.style.boxShadow = 'none';
  resultBanner.style.color = 'var(--white)';
  updateBalanceDisplay();
  updateBetDisplay();
  btnLaunch.disabled = false;
});

/* ════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════ */
updateBalanceDisplay();
updateBetDisplay();
loop();
</script>
