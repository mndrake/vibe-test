<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>plinks — Space Plinko</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #010a18;
  --navy: #050f22;
  --panel: rgba(5, 15, 40, 0.85);
  --blue: #00aaff;
  --purple: #9b30ff;
  --gold: #ffd700;
  --green: #00ff88;
  --red: #ff2244;
  --white: #e8f0ff;
  --glow-blue: 0 0 12px #00aaff88, 0 0 24px #00aaff44;
  --glow-gold: 0 0 12px #ffd70088, 0 0 24px #ffd70044;
  --glow-purple: 0 0 12px #9b30ff88, 0 0 24px #9b30ff44;
}

body {
  font-family: 'Orbitron', monospace;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Starfield ── */
#starfield {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── Layout ── */
#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 900px;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
}

/* ── Header ── */
#header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border: 1px solid var(--blue);
  border-radius: 12px;
  padding: 0.75rem 1.5rem;
  box-shadow: var(--glow-blue);
}

#header h1 {
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(90deg, var(--blue), var(--purple), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#balance-display {
  text-align: right;
}

#balance-label {
  font-size: 0.6rem;
  color: var(--blue);
  letter-spacing: 2px;
  text-transform: uppercase;
}

#balance-amount {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gold);
  text-shadow: var(--glow-gold);
}

/* ── Main area ── */
#main {
  display: flex;
  gap: 1rem;
  width: 100%;
  align-items: flex-start;
}

/* ── Canvas ── */
#canvas-wrap {
  position: relative;
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--purple);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--glow-purple);
}

#game-canvas {
  display: block;
  width: 100%;
  height: auto;
  cursor: crosshair;
}

/* ── Side Panel ── */
#side-panel {
  width: 200px;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.panel-box {
  background: var(--panel);
  border: 1px solid var(--blue);
  border-radius: 10px;
  padding: 1rem;
  box-shadow: var(--glow-blue);
}

.panel-box h3 {
  font-size: 0.6rem;
  letter-spacing: 2px;
  color: var(--blue);
  margin-bottom: 0.75rem;
  text-transform: uppercase;
}

/* ── Bet controls ── */
#bet-display {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--gold);
  text-align: center;
  margin-bottom: 0.5rem;
  text-shadow: var(--glow-gold);
}

#bet-slider {
  width: 100%;
  accent-color: var(--blue);
  margin-bottom: 0.5rem;
  cursor: pointer;
}

.bet-presets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.35rem;
  margin-bottom: 0.5rem;
}

.preset-btn {
  background: rgba(0,170,255,0.1);
  border: 1px solid var(--blue);
  border-radius: 5px;
  color: var(--blue);
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem;
  padding: 0.3rem 0;
  cursor: pointer;
  transition: all 0.15s;
}

.preset-btn:hover {
  background: rgba(0,170,255,0.25);
  box-shadow: var(--glow-blue);
}

#btn-allin {
  width: 100%;
  background: rgba(255,210,0,0.1);
  border: 1px solid var(--gold);
  border-radius: 5px;
  color: var(--gold);
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem;
  padding: 0.35rem 0;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 1px;
}

#btn-allin:hover {
  background: rgba(255,210,0,0.25);
  box-shadow: var(--glow-gold);
}

/* ── Launch button ── */
#btn-launch {
  width: 100%;
  padding: 0.9rem;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: 'Orbitron', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 0 20px rgba(0,170,255,0.4);
}

#btn-launch:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 0 30px rgba(0,170,255,0.6);
}

#btn-launch:active:not(:disabled) {
  transform: translateY(0);
}

#btn-launch:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ── Prize table ── */
.prize-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.3rem 0.4rem;
  border-radius: 5px;
  margin-bottom: 0.25rem;
  font-size: 0.55rem;
  letter-spacing: 0.5px;
  transition: all 0.3s;
}

.prize-row .mult {
  font-weight: 700;
  font-size: 0.75rem;
}

.prize-row.bust    { border-left: 3px solid var(--red);    color: var(--red); }
.prize-row.signal  { border-left: 3px solid #88aaff;       color: #88aaff; }
.prize-row.artifact{ border-left: 3px solid var(--blue);   color: var(--blue); }
.prize-row.warp    { border-left: 3px solid var(--purple);  color: var(--purple); }
.prize-row.jackpot { border-left: 3px solid var(--gold);   color: var(--gold); }

.prize-row.highlight {
  background: rgba(255,255,255,0.12);
  transform: scale(1.03);
}

/* ── Result message ── */
#result-banner {
  width: 100%;
  text-align: center;
  padding: 0.6rem 1rem;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 2px;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 1px solid #333;
  transition: all 0.3s;
}

/* ── Game Over overlay ── */
#gameover {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(1, 5, 18, 0.92);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
}

#gameover.visible { display: flex; }

#gameover h2 {
  font-size: 3rem;
  color: var(--red);
  text-shadow: 0 0 30px var(--red), 0 0 60px #ff224477;
  letter-spacing: 6px;
  animation: pulse-red 1.2s ease-in-out infinite;
}

@keyframes pulse-red {
  0%, 100% { text-shadow: 0 0 30px var(--red), 0 0 60px #ff224477; }
  50%       { text-shadow: 0 0 60px var(--red), 0 0 120px #ff224477; }
}

#gameover p {
  font-size: 1rem;
  color: var(--white);
  opacity: 0.7;
  letter-spacing: 1px;
}

#btn-tryagain {
  padding: 1rem 3rem;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  border: none;
  border-radius: 12px;
  color: #fff;
  font-family: 'Orbitron', monospace;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(155,48,255,0.5);
  transition: all 0.2s;
}

#btn-tryagain:hover {
  transform: scale(1.05);
  box-shadow: 0 0 50px rgba(155,48,255,0.7);
}

/* ── Particle canvas ── */
#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 50;
}

/* ── Flash overlay ── */
#flash {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 60;
  opacity: 0;
  transition: opacity 0.1s;
}

@media (max-width: 620px) {
  #main { flex-direction: column; }
  #side-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
  #side-panel .panel-box { flex: 1; min-width: 160px; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<canvas id="particle-canvas"></canvas>
<div id="flash"></div>

<div id="app">
  <header id="header">
    <h1>plinks</h1>
    <div id="balance-display">
      <div id="balance-label">Credits</div>
      <div id="balance-amount">$50.00</div>
    </div>
  </header>

  <div id="result-banner">— Awaiting Launch —</div>

  <div id="main">
    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="side-panel">
      <!-- Bet -->
      <div class="panel-box">
        <h3>Bet Amount</h3>
        <div id="bet-display">$5.00</div>
        <input type="range" id="bet-slider" min="5" max="10000" step="5" value="5">
        <div class="bet-presets">
          <button class="preset-btn" data-amt="5">$5</button>
          <button class="preset-btn" data-amt="25">$25</button>
          <button class="preset-btn" data-amt="100">$100</button>
          <button class="preset-btn" data-amt="500">$500</button>
        </div>
        <button id="btn-allin">ALL IN</button>
      </div>

      <!-- Launch -->
      <button id="btn-launch">LAUNCH</button>

      <!-- Prize table -->
      <div class="panel-box">
        <h3>Prize Table</h3>
        <div class="prize-row bust"     id="pr-bust">    <span>HULL BREACH</span><span class="mult">0x</span></div>
        <div class="prize-row signal"   id="pr-signal">  <span>SIGNAL</span>     <span class="mult">1.5x</span></div>
        <div class="prize-row artifact" id="pr-artifact"><span>ARTIFACT</span>   <span class="mult">2x</span></div>
        <div class="prize-row warp"     id="pr-warp">    <span>WARP CORE</span>  <span class="mult">5x</span></div>
        <div class="prize-row jackpot"  id="pr-jackpot"> <span>1ST CONTACT</span><span class="mult">10x</span></div>
      </div>
    </div>
  </div>
</div>

<!-- Game Over -->
<div id="gameover">
  <h2>HULL BREACH</h2>
  <p>All credits lost. Transmission ended.</p>
  <p id="go-final" style="color:var(--gold);font-size:0.9rem;">Peak Balance: $0.00</p>
  <button id="btn-tryagain">TRY AGAIN</button>
</div>

<script>
/* ════════════════════════════════════════════════
   CONSTANTS
   ════════════════════════════════════════════════ */
const OUTCOME_MAP = {
  bust:     { id: 'bust',     label: 'HULL BREACH',     mult: 0,   color: '#ff2244' },
  signal:   { id: 'signal',   label: 'SIGNAL DETECTED', mult: 1.5, color: '#88aaff' },
  artifact: { id: 'artifact', label: 'ALIEN ARTIFACT',  mult: 2,   color: '#00ccff' },
  warp:     { id: 'warp',     label: 'WARP CORE!',      mult: 5,   color: '#9b30ff' },
  jackpot:  { id: 'jackpot',  label: 'FIRST CONTACT!',  mult: 10,  color: '#ffd700' },
};

// Fixed slot prizes — 13 slots, symmetric, jackpot at centre
const SLOT_LAYOUT = [
  'bust','bust','signal','signal','artifact',
  'warp','jackpot','warp','artifact',
  'signal','signal','bust','bust'
];

const ROWS = 12;
const PEG_RADIUS = 5;
const BALL_RADIUS = 8;
const CANVAS_W = 520;
const CANVAS_H = 625;
const GRAVITY = 0.38;
const BOUNCE = 0.38;
const FRICTION = 0.985;
const SLOT_COUNT = ROWS + 1; // 13 slots
const WALL_W = 5;

/* ════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════ */
let balance     = 50;
let highBalance = 50;
let betAmt      = 5;
let dropping    = false;
let launchX     = CANVAS_W / 2;

/* ════════════════════════════════════════════════
   DOM
   ════════════════════════════════════════════════ */
const gameCanvas    = document.getElementById('game-canvas');
const gctx          = gameCanvas.getContext('2d');
const starCanvas    = document.getElementById('starfield');
const sctx          = starCanvas.getContext('2d');
const particleCanvas= document.getElementById('particle-canvas');
const pctx          = particleCanvas.getContext('2d');
const flash         = document.getElementById('flash');
const balanceEl     = document.getElementById('balance-amount');
const betDisplay    = document.getElementById('bet-display');
const betSlider     = document.getElementById('bet-slider');
const btnLaunch     = document.getElementById('btn-launch');
const btnAllin      = document.getElementById('btn-allin');
const resultBanner  = document.getElementById('result-banner');
const gameover      = document.getElementById('gameover');
const btnTryagain   = document.getElementById('btn-tryagain');

/* ════════════════════════════════════════════════
   CANVAS SIZING
   ════════════════════════════════════════════════ */
gameCanvas.width  = CANVAS_W;
gameCanvas.height = CANVAS_H;

function resizeAux() {
  starCanvas.width  = window.innerWidth;
  starCanvas.height = window.innerHeight;
  particleCanvas.width  = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}
resizeAux();
window.addEventListener('resize', resizeAux);

/* ════════════════════════════════════════════════
   STARFIELD
   ════════════════════════════════════════════════ */
const stars = Array.from({ length: 200 }, () => ({
  x: Math.random() * 2000,
  y: Math.random() * 2000,
  r: Math.random() * 1.5 + 0.3,
  a: Math.random(),
  da: (Math.random() - 0.5) * 0.006,
}));

function drawStarfield() {
  sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  stars.forEach(s => {
    s.a = Math.max(0.1, Math.min(1, s.a + s.da));
    if (s.a <= 0.1 || s.a >= 1) s.da = -s.da;
    sctx.beginPath();
    sctx.arc(s.x % starCanvas.width, s.y % starCanvas.height, s.r, 0, Math.PI * 2);
    sctx.fillStyle = `rgba(200,220,255,${s.a})`;
    sctx.fill();
  });
}

/* ════════════════════════════════════════════════
   PEG GRID LAYOUT
   ════════════════════════════════════════════════ */
const PAD_TOP      = 52;
const PAD_SIDE     = 32;
const GHOST_Y      = 20;
const usableW      = CANVAS_W - PAD_SIDE * 2;       // 456
const slotW        = usableW / SLOT_COUNT;            // ~35.1
const PEG_AREA_H   = 355;
const PEG_AREA_BOT = PAD_TOP + PEG_AREA_H;          // 407
const GATE_TOP     = PEG_AREA_BOT + 22;             // 429
const GATE_H       = 181;
const GATE_BOT     = GATE_TOP + GATE_H;             // 610

const pegs = [];
for (let row = 0; row < ROWS; row++) {
  const cols    = row + 2;
  const spacing = usableW / (cols - 1);
  const rowY    = PAD_TOP + (row / (ROWS - 1)) * PEG_AREA_H;
  for (let col = 0; col < cols; col++) {
    pegs.push({ x: PAD_SIDE + col * spacing, y: rowY });
  }
}

/* slot centres are at PAD_SIDE + (i + 0.5) * slotW — no separate array needed */

/* ════════════════════════════════════════════════
   BALL PHYSICS
   ════════════════════════════════════════════════ */
let ball = null;
let pegFlash = {}; // pegIdx -> timer

function spawnBall() {
  ball = {
    x: launchX,
    y: GHOST_Y,
    vx: (Math.random() - 0.5) * 0.8,
    vy: 2,
    trail: [],
    inGate: false,
    landed: false,
    landSlot: -1,
    gateTargetX: 0,
  };
}

function updateBall() {
  if (!ball || ball.landed) return;

  // Inside a gate: ease to slot centre and fall to floor
  if (ball.inGate) {
    ball.x += (ball.gateTargetX - ball.x) * 0.18;
    ball.vy = Math.min(ball.vy + GRAVITY * 0.55, 9);
    ball.y += ball.vy;
    if (ball.y >= GATE_BOT - BALL_RADIUS) {
      ball.y = GATE_BOT - BALL_RADIUS;
      ball.vy = 0;
      ball.landed = true;
      onBallLanded();
    }
    return;
  }

  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 18) ball.trail.shift();

  ball.vy += GRAVITY;
  ball.vx *= FRICTION;
  ball.x  += ball.vx;
  ball.y  += ball.vy;

  // Wall bounce
  if (ball.x < PAD_SIDE + BALL_RADIUS) {
    ball.x  = PAD_SIDE + BALL_RADIUS;
    ball.vx = Math.abs(ball.vx) * BOUNCE + 0.3;
  }
  if (ball.x > CANVAS_W - PAD_SIDE - BALL_RADIUS) {
    ball.x  = CANVAS_W - PAD_SIDE - BALL_RADIUS;
    ball.vx = -(Math.abs(ball.vx) * BOUNCE + 0.3);
  }

  // Peg collision
  for (let i = 0; i < pegs.length; i++) {
    const peg = pegs[i];
    const dx = ball.x - peg.x, dy = ball.y - peg.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const minD = BALL_RADIUS + PEG_RADIUS;
    if (dist < minD && dist > 0) {
      const nx = dx / dist, ny = dy / dist;
      ball.x += nx * (minD - dist);
      ball.y += ny * (minD - dist);
      const dot = ball.vx * nx + ball.vy * ny;
      ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE + (Math.random() - 0.5) * 1.0;
      ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE;
      if (ball.vy < 0.8) ball.vy = 0.8;
      pegFlash[i] = 10;
      playPegSound();
      break;
    }
  }

  // Enter gate when ball reaches gate top
  if (ball.y + BALL_RADIUS >= GATE_TOP) {
    const raw = (ball.x - PAD_SIDE) / slotW;
    ball.landSlot    = Math.max(0, Math.min(SLOT_COUNT - 1, Math.floor(raw)));
    ball.inGate      = true;
    ball.vx          = 0;
    ball.trail       = [];
    ball.gateTargetX = PAD_SIDE + (ball.landSlot + 0.5) * slotW;
  }
}

/* ════════════════════════════════════════════════
   RESULT HANDLING
   ════════════════════════════════════════════════ */

function onBallLanded() {
  const outcome = OUTCOME_MAP[SLOT_LAYOUT[ball.landSlot]];

  // Highlight prize row
  document.querySelectorAll('.prize-row').forEach(el => el.classList.remove('highlight'));
  document.getElementById('pr-' + outcome.id).classList.add('highlight');

  setTimeout(() => applyResult(outcome), 650);
}

function applyResult(outcome) {
  const winnings = Math.round(betAmt * outcome.mult * 100) / 100;
  balance = Math.round((balance - betAmt + winnings) * 100) / 100;
  if (balance < 0) balance = 0;

  if (balance > highBalance) highBalance = balance;
  updateBalanceDisplay();
  showResult(outcome, winnings);

  if (outcome.id === 'bust') {
    triggerFlash('#ff2244', 0.35);
  } else if (outcome.id === 'jackpot') {
    triggerFlash('#ffd700', 0.4);
    launchConfetti();
  } else if (outcome.id === 'warp') {
    triggerFlash('#9b30ff', 0.3);
    launchStarBurst();
  }

  playResultSound(outcome);

  setTimeout(() => {
    dropping = false;
    ball = null;
    if (balance <= 0) {
      showGameOver();
    } else {
      btnLaunch.disabled = false;
      clampBet();
    }
  }, 1800);
}

function showResult(outcome, winnings) {
  resultBanner.style.border = `1px solid ${outcome.color}`;
  resultBanner.style.boxShadow = `0 0 16px ${outcome.color}66`;
  resultBanner.style.color = outcome.color;

  if (outcome.mult === 0) {
    resultBanner.textContent = `💥 ${outcome.label} — Lost $${betAmt.toFixed(2)}`;
  } else {
    resultBanner.textContent = `✨ ${outcome.label} — Won $${winnings.toFixed(2)} (${outcome.mult}x)`;
  }
}

/* ════════════════════════════════════════════════
   DRAWING
   ════════════════════════════════════════════════ */
function drawBoard() {
  gctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // Subtle vertical grid
  gctx.strokeStyle = 'rgba(0,100,200,0.04)';
  gctx.lineWidth = 1;
  for (let x = 0; x < CANVAS_W; x += 30) {
    gctx.beginPath(); gctx.moveTo(x, 0); gctx.lineTo(x, CANVAS_H); gctx.stroke();
  }

  drawGates();
  drawPegs();
  if (!dropping) drawGhost();
  if (ball) drawBall();
}

function drawGates() {
  const activeSlot = ball ? ball.landSlot : -1;
  const aimSlot    = dropping ? -1
    : Math.max(0, Math.min(SLOT_COUNT - 1, Math.floor((launchX - PAD_SIDE) / slotW)));

  // Gate interiors
  for (let i = 0; i < SLOT_COUNT; i++) {
    const outcome  = OUTCOME_MAP[SLOT_LAYOUT[i]];
    const gx       = PAD_SIDE + i * slotW + WALL_W / 2;
    const gw       = slotW - WALL_W;
    const isActive = i === activeSlot && ball && (ball.inGate || ball.landed);
    const isAim    = i === aimSlot;

    // Interior fill
    const grad = gctx.createLinearGradient(0, GATE_TOP, 0, GATE_BOT);
    if (isActive) {
      grad.addColorStop(0, outcome.color + '55');
      grad.addColorStop(1, outcome.color + 'bb');
    } else if (isAim) {
      grad.addColorStop(0, outcome.color + '1a');
      grad.addColorStop(1, outcome.color + '44');
    } else {
      grad.addColorStop(0, 'rgba(4,10,28,0.96)');
      grad.addColorStop(1, 'rgba(8,18,48,0.96)');
    }
    gctx.fillStyle = grad;
    gctx.fillRect(gx, GATE_TOP, gw, GATE_H);

    // Prize strip at bottom
    const stripH = 34;
    if (isActive) { gctx.shadowColor = outcome.color; gctx.shadowBlur = 16; }
    gctx.fillStyle = isActive ? outcome.color + 'ee'
                   : isAim    ? outcome.color + '99'
                              : outcome.color + '55';
    gctx.fillRect(gx, GATE_BOT - stripH, gw, stripH);
    gctx.shadowBlur = 0;

    // Multiplier label
    gctx.font = `bold 10px Orbitron`;
    gctx.textAlign = 'center';
    gctx.textBaseline = 'middle';
    if (isActive) { gctx.shadowColor = outcome.color; gctx.shadowBlur = 8; }
    gctx.fillStyle = '#ffffff';
    gctx.fillText(outcome.mult + 'x', gx + gw / 2, GATE_BOT - stripH / 2);
    gctx.shadowBlur = 0;

    // Colour dot at gate entrance
    gctx.beginPath();
    gctx.arc(gx + gw / 2, GATE_TOP + 11, isActive ? 5 : 3.5, 0, Math.PI * 2);
    gctx.fillStyle = isActive ? outcome.color : outcome.color + (isAim ? 'cc' : '88');
    if (isActive) { gctx.shadowColor = outcome.color; gctx.shadowBlur = 10; }
    gctx.fill();
    gctx.shadowBlur = 0;
  }

  // Walls between gates (drawn on top of interiors)
  for (let i = 0; i <= SLOT_COUNT; i++) {
    const wx = PAD_SIDE + i * slotW;
    // Wall body
    gctx.fillStyle = '#1a2a50';
    gctx.fillRect(wx - WALL_W / 2, GATE_TOP - 6, WALL_W, GATE_H + 8);
    // Inner highlight stripe
    gctx.fillStyle = '#3a5888';
    gctx.fillRect(wx - 1, GATE_TOP - 6, 2, GATE_H + 8);
    // Funnel-tip triangle at wall top
    gctx.beginPath();
    gctx.moveTo(wx - WALL_W / 2 - 3, GATE_TOP - 6);
    gctx.lineTo(wx + WALL_W / 2 + 3, GATE_TOP - 6);
    gctx.lineTo(wx, GATE_TOP - 16);
    gctx.closePath();
    gctx.fillStyle = '#4a68a8';
    gctx.fill();
  }

  // Entrance line across top of all gates
  gctx.strokeStyle = '#2a4070';
  gctx.lineWidth = 2;
  gctx.beginPath();
  gctx.moveTo(PAD_SIDE, GATE_TOP - 6);
  gctx.lineTo(CANVAS_W - PAD_SIDE, GATE_TOP - 6);
  gctx.stroke();
}

function drawPegs() {
  pegs.forEach((peg, i) => {
    const fl    = pegFlash[i] || 0;
    const color = fl > 0 ? '#00ffff' : '#4488ff';
    const blur  = fl > 0 ? 16 : 5;
    const grad  = gctx.createRadialGradient(peg.x - 1, peg.y - 1, 0, peg.x, peg.y, PEG_RADIUS);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.5, color);
    grad.addColorStop(1, fl > 0 ? '#00cccc88' : '#112288aa');
    gctx.beginPath();
    gctx.arc(peg.x, peg.y, PEG_RADIUS, 0, Math.PI * 2);
    gctx.fillStyle = grad;
    gctx.shadowColor = color;
    gctx.shadowBlur  = blur;
    gctx.fill();
    gctx.shadowBlur = 0;
    if (fl > 0) pegFlash[i]--;
  });
}

function drawGhost() {
  const aimSlot   = Math.max(0, Math.min(SLOT_COUNT - 1, Math.floor((launchX - PAD_SIDE) / slotW)));
  const aimColor  = OUTCOME_MAP[SLOT_LAYOUT[aimSlot]].color;
  const aimLabel  = OUTCOME_MAP[SLOT_LAYOUT[aimSlot]].mult + 'x — ' + OUTCOME_MAP[SLOT_LAYOUT[aimSlot]].label;

  // Dashed guide line to gate
  gctx.save();
  gctx.setLineDash([4, 6]);
  gctx.strokeStyle = 'rgba(0,200,255,0.2)';
  gctx.lineWidth = 1.5;
  gctx.beginPath();
  gctx.moveTo(launchX, GHOST_Y + BALL_RADIUS + 3);
  gctx.lineTo(launchX, GATE_TOP - 16);
  gctx.stroke();
  gctx.restore();

  // Ghost ball
  gctx.beginPath();
  gctx.arc(launchX, GHOST_Y, BALL_RADIUS, 0, Math.PI * 2);
  gctx.fillStyle = 'rgba(0,200,255,0.18)';
  gctx.fill();
  gctx.strokeStyle = 'rgba(0,220,255,0.75)';
  gctx.lineWidth = 2;
  gctx.stroke();

  // Pulsing ring
  const pulse = (Date.now() % 1400) / 1400;
  gctx.beginPath();
  gctx.arc(launchX, GHOST_Y, BALL_RADIUS + 3 + pulse * 8, 0, Math.PI * 2);
  gctx.strokeStyle = `rgba(0,200,255,${0.4 * (1 - pulse)})`;
  gctx.lineWidth = 1.5;
  gctx.stroke();

  // Aimed prize label
  gctx.font = '7.5px Orbitron';
  gctx.textAlign = 'center';
  gctx.textBaseline = 'bottom';
  gctx.fillStyle = aimColor;
  gctx.shadowColor = aimColor;
  gctx.shadowBlur  = 6;
  gctx.fillText(aimLabel, launchX, GHOST_Y - BALL_RADIUS - 4);
  gctx.shadowBlur = 0;

  // Static hint at top of canvas
  gctx.font = '6px Orbitron';
  gctx.fillStyle = 'rgba(0,180,255,0.4)';
  gctx.textBaseline = 'top';
  gctx.shadowBlur = 0;
  gctx.fillText('← MOVE TO AIM  |  CLICK OR SPACE TO DROP →', CANVAS_W / 2, 2);
}

function drawBall() {
  // Trail
  ball.trail.forEach((pt, i) => {
    const alpha = i / ball.trail.length;
    const r = BALL_RADIUS * (0.3 + 0.7 * alpha);
    gctx.beginPath();
    gctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    gctx.fillStyle = `rgba(0,200,255,${alpha * 0.25})`;
    gctx.fill();
  });

  // Glow
  gctx.shadowColor = '#00eeff';
  gctx.shadowBlur  = 18;

  // Ball body
  const grad = gctx.createRadialGradient(
    ball.x - BALL_RADIUS * 0.3, ball.y - BALL_RADIUS * 0.3, BALL_RADIUS * 0.1,
    ball.x, ball.y, BALL_RADIUS
  );
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.35, '#00ddff');
  grad.addColorStop(0.8, '#0044ff');
  grad.addColorStop(1, '#001188');

  gctx.beginPath();
  gctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
  gctx.fillStyle = grad;
  gctx.fill();
  gctx.shadowBlur = 0;
}

/* ════════════════════════════════════════════════
   PARTICLES
   ════════════════════════════════════════════════ */
let particles = [];

function launchConfetti() {
  for (let i = 0; i < 220; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 8;
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 6,
      r: 5 + Math.random() * 6,
      color: ['#ffd700','#ff9900','#ff2244','#00aaff','#9b30ff','#00ff88'][Math.floor(Math.random() * 6)],
      life: 1,
      decay: 0.012 + Math.random() * 0.012,
      gravity: 0.2,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.2,
      rect: Math.random() > 0.4,
    });
  }
}

function launchStarBurst() {
  for (let i = 0; i < 100; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight * 0.6,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      r: 3 + Math.random() * 4,
      color: ['#9b30ff','#cc66ff','#ffffff','#6600ff'][Math.floor(Math.random() * 4)],
      life: 1,
      decay: 0.02 + Math.random() * 0.015,
      gravity: 0.12,
      rot: 0, rotV: 0,
      rect: false,
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  pctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  particles.forEach(p => {
    p.vx *= 0.98;
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    p.rot += p.rotV;

    pctx.globalAlpha = Math.max(0, p.life);
    pctx.fillStyle = p.color;

    if (p.rect) {
      pctx.save();
      pctx.translate(p.x, p.y);
      pctx.rotate(p.rot);
      pctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r);
      pctx.restore();
    } else {
      pctx.beginPath();
      pctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      pctx.fill();
    }
    pctx.globalAlpha = 1;
  });
}

/* ════════════════════════════════════════════════
   FLASH
   ════════════════════════════════════════════════ */
function triggerFlash(color, alpha) {
  flash.style.background = color;
  flash.style.opacity = alpha;
  setTimeout(() => { flash.style.opacity = 0; }, 120);
}

/* ════════════════════════════════════════════════
   WEB AUDIO
   ════════════════════════════════════════════════ */
let audioCtx = null;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playPegSound() {
  try {
    const ctx = getAudio();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g);
    g.connect(ctx.destination);
    o.type = 'sine';
    const freq = 400 + Math.random() * 600;
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 0.5, ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + 0.12);
  } catch(e) {}
}

function playResultSound(outcome) {
  try {
    const ctx = getAudio();
    if (outcome.id === 'bust') {
      // Low descending womp
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(180, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.6);
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
      o.start(); o.stop(ctx.currentTime + 0.7);
    } else if (outcome.id === 'jackpot') {
      // Fanfare: ascending notes
      [523, 659, 784, 1047].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'square';
        o.frequency.value = freq;
        const t = ctx.currentTime + i * 0.12;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.15, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        o.start(t); o.stop(t + 0.4);
      });
    } else if (outcome.id === 'warp') {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(200, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.5);
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
      o.start(); o.stop(ctx.currentTime + 0.6);
    } else {
      // Generic blip
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(440 * outcome.mult, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(880 * outcome.mult, ctx.currentTime + 0.25);
      g.gain.setValueAtTime(0.12, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      o.start(); o.stop(ctx.currentTime + 0.35);
    }
  } catch(e) {}
}

function playAmbient() {
  try {
    const ctx = getAudio();
    const bufSize = ctx.sampleRate * 3;
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let phase = 0;
    for (let i = 0; i < bufSize; i++) {
      phase += 0.0001;
      data[i] = (Math.sin(i * 0.0003) * 0.3 + Math.sin(i * 0.00017) * 0.2) * Math.sin(phase) * 0.04;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;
    const g = ctx.createGain();
    g.gain.value = 0.4;
    src.connect(g);
    g.connect(ctx.destination);
    src.start();
  } catch(e) {}
}

/* ════════════════════════════════════════════════
   GAME LOOP
   ════════════════════════════════════════════════ */
function loop() {
  drawStarfield();
  if (dropping) updateBall();
  drawBoard();
  updateParticles();
  requestAnimationFrame(loop);
}

/* ════════════════════════════════════════════════
   UI CONTROLS
   ════════════════════════════════════════════════ */
function updateBalanceDisplay() {
  balanceEl.textContent = '$' + balance.toFixed(2);
}

function updateBetDisplay() {
  betDisplay.textContent = '$' + betAmt.toFixed(2);
  betSlider.value = betAmt;
}

function clampBet() {
  betAmt = Math.min(betAmt, balance);
  betAmt = Math.max(5, betAmt);
  updateBetDisplay();
}

betSlider.addEventListener('input', () => {
  betAmt = parseFloat(betSlider.value);
  clampBet();
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    betAmt = parseFloat(btn.dataset.amt);
    clampBet();
  });
});

btnAllin.addEventListener('click', () => {
  betAmt = balance;
  updateBetDisplay();
});

btnLaunch.addEventListener('click', () => launch());

/* ── Canvas aim controls ── */
function clampLaunchX(x) {
  return Math.max(PAD_SIDE + BALL_RADIUS, Math.min(CANVAS_W - PAD_SIDE - BALL_RADIUS, x));
}
function canvasToGameX(clientX) {
  const rect   = gameCanvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  return clampLaunchX((clientX - rect.left) * scaleX);
}

gameCanvas.addEventListener('mousemove', e => {
  if (!dropping) launchX = canvasToGameX(e.clientX);
});
gameCanvas.addEventListener('click', e => {
  if (dropping) return;
  launchX = canvasToGameX(e.clientX);
  launch();
});
gameCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dropping) launchX = canvasToGameX(e.touches[0].clientX);
}, { passive: false });
gameCanvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!dropping) launch();
}, { passive: false });

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    if (!dropping) { e.preventDefault(); launch(); }
  }
  if (e.code === 'ArrowLeft'  && !dropping) {
    e.preventDefault();
    launchX = clampLaunchX(launchX - slotW * 0.5);
  }
  if (e.code === 'ArrowRight' && !dropping) {
    e.preventDefault();
    launchX = clampLaunchX(launchX + slotW * 0.5);
  }
});

function launch() {
  if (dropping) return;
  if (balance < 5) { showGameOver(); return; }
  clampBet();
  if (betAmt < 5 || betAmt > balance) return;

  if (!audioCtx) playAmbient();

  dropping = true;
  btnLaunch.disabled = true;
  resultBanner.style.border = '1px solid #333';
  resultBanner.style.boxShadow = 'none';
  resultBanner.style.color = 'var(--white)';
  resultBanner.textContent = '— Launching —';

  document.querySelectorAll('.prize-row').forEach(el => el.classList.remove('highlight'));

  spawnBall();
}

/* ════════════════════════════════════════════════
   GAME OVER
   ════════════════════════════════════════════════ */
function showGameOver() {
  document.getElementById('go-final').textContent = 'Peak Balance: $' + highBalance.toFixed(2);
  gameover.classList.add('visible');
}

btnTryagain.addEventListener('click', () => {
  balance     = 50;
  highBalance = 50;
  betAmt      = 5;
  ball     = null;
  dropping = false;
  particles = [];
  document.querySelectorAll('.prize-row').forEach(el => el.classList.remove('highlight'));
  gameover.classList.remove('visible');
  resultBanner.textContent = '— Awaiting Launch —';
  resultBanner.style.border = '1px solid #333';
  resultBanner.style.boxShadow = 'none';
  resultBanner.style.color = 'var(--white)';
  updateBalanceDisplay();
  updateBetDisplay();
  btnLaunch.disabled = false;
});

/* ════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════ */
updateBalanceDisplay();
updateBetDisplay();
loop();
</script>
